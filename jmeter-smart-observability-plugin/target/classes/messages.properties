# Smart Observability AI Plugin - JMeter GUI resource strings
plugin.name=Smart Observability AI Backend Listener
plugin.description=Captures JMeter metrics, ships them to Splunk HEC, correlates failures with Splunk logs, fetches Splunk Observability Cloud metrics, and runs LLM-based root cause analysis at teardown.

param.Splunk_URL=Splunk HEC endpoint (e.g. https://splunk.company.com:8088/services/collector)
param.Splunk_Token=Splunk HEC authentication token
param.Splunk_Index=Splunk index that stores JMeter performance events
param.Environment=Logical environment name (e.g. dev, staging, perf)
param.Application=Application under test
param.Test_Name=Human-readable JMeter test name
param.Local_Store_Path=Path to the newline-delimited JSON metrics file
param.Enable_Splunk=Set to true to enable Splunk HEC forwarding
param.Enable_Local_Store=Set to true to enable the local JSON store
param.HEC_Batch_Enabled=Set to true to use the asynchronous batching HEC dispatcher (recommended for high-RPS tests)
param.HEC_Batch_Size=Maximum HEC events per batched HTTP POST
param.HEC_Flush_Interval_Ms=Batcher flush interval in milliseconds
param.HEC_Queue_Capacity=Bounded in-memory queue capacity for pending HEC events
param.TLS_Insecure=Set to true to skip TLS certificate verification for Splunk HEC, Search, and Observability endpoints (self-signed labs only)
param.Output_Directory=Directory that relative output paths are resolved against (blank = JMeter process cwd)
param.Report_Output_Path=Path to the styled HTML report (relative paths resolved under Output_Directory)
param.Enable_Baseline_Diff=Set to true to compare this run against a saved baseline and pipe the diff into the LLM prompt
param.Baseline_Path=Baseline JSON file path (blank = baseline-<Test_Name>.json under Output_Directory)
param.Baseline_Update_Mode=When to overwrite the baseline: always, never, on-success (no errors)

param.Splunk_Search_URL=Splunk management/REST endpoint (e.g. https://splunk.company.com:8089)
param.Splunk_Search_Token=Bearer token for the Splunk Search REST API
param.Splunk_Log_Index=Splunk index containing application logs to correlate against failures
param.Enable_Correlation=Set to true to run Splunk log correlation for failed samples at teardown
param.Correlation_Window_Seconds=Half-width in seconds of the log window around each failed sample timestamp
param.Correlation_Output_Path=Path to the JSON file that records correlated log windows

param.O11y_API_URL=Splunk Observability Cloud API base URL (e.g. https://api.us1.signalfx.com)
param.O11y_Token=X-SF-TOKEN for Splunk Observability Cloud
param.O11y_Metrics=Comma-separated list of metric names (or full SignalFlow programs) to fetch
param.O11y_Resolution_Ms=Time-series resolution in milliseconds
param.Enable_O11y=Set to true to fetch Splunk Observability Cloud metrics for the JMeter test window
param.O11y_Output_Path=Path to the JSON file that records fetched O11y metric points

param.Enable_LLM=Set to true to run LLM-based root cause analysis; falls back to static text on any error
param.LLM_Provider=One of: openai, anthropic, gemini, grok, groq
param.LLM_Model=Model identifier for the chosen provider (blank = provider default)
param.LLM_API_Key=API key value; if set overrides the env var below
param.LLM_API_Key_Env=Name of the environment variable holding the API key (used when LLM_API_Key is blank)
param.LLM_Base_URL=Optional API base URL override (blank = provider default)
