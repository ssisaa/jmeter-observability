# Smart Observability AI Plugin - JMeter GUI resource strings
plugin.name=Smart Observability AI Backend Listener
plugin.description=Captures JMeter metrics, stores them locally as JSON, ships them to Splunk HEC, correlates failures with Splunk app logs, and runs AI analysis at teardown.

param.Splunk_URL=Splunk HEC endpoint (e.g. https://splunk.company.com:8088/services/collector)
param.Splunk_Token=Splunk HEC authentication token
param.Splunk_Index=Splunk index that stores JMeter performance events
param.Environment=Logical environment name (e.g. dev, staging, perf)
param.Application=Application under test
param.Test_Name=Human-readable JMeter test name
param.Local_Store_Path=Path to the newline-delimited JSON metrics file
param.Enable_Splunk=Set to true to enable Splunk HEC forwarding
param.Enable_Local_Store=Set to true to enable the local JSON store
param.Splunk_Search_URL=Splunk management/REST endpoint (e.g. https://splunk.company.com:8089)
param.Splunk_Search_Token=Bearer token for the Splunk Search REST API
param.Splunk_Log_Index=Splunk index containing application logs to correlate against failures
param.Enable_Correlation=Set to true to run Splunk log correlation for failed samples at teardown
param.Correlation_Window_Seconds=Half-width in seconds of the log window around each failed sample timestamp
param.Correlation_Output_Path=Path to the JSON file that records correlated log windows
